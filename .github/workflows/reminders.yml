name: Chạm notifications

# Every 15 minutes. This is the backup for the scheduled task on Peter's PC,
# so notifications keep going out when the laptop is shut. Both write what
# they have sent to the database, so running both never sends anything twice.
#
# Nothing happens until the secrets exist - each script checks, says what is
# missing, and exits cleanly rather than failing every quarter of an hour.
#
#   Push  : FIREBASE_SERVICE_ACCOUNT, VAPID_PRIVATE_KEY
#   Email : FIREBASE_SERVICE_ACCOUNT, GMAIL_USER, GMAIL_APP_PASSWORD
#
# GitHub's scheduler runs late when it is busy. Ten or twenty minutes of
# drift is normal and nothing to fix.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be sent, send nothing"
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet google-cloud-firestore pywebpush

      - name: Which run is this
        id: mode
        run: |
          DRY=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          # 00:xx UTC is 07:xx in Vietnam; the digest itself makes sure it only goes once a day
          DIGEST=""
          if [ "$(date -u +%H)" = "00" ]; then DIGEST="--digest"; fi
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Push notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python scripts/push.py ${{ steps.mode.outputs.dry }}

      - name: Email
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/notify.py ${{ steps.mode.outputs.digest }} ${{ steps.mode.outputs.dry }}

      # Money lines into Thuan's sheet. Waits, saying why, until the Sheets
      # API is on and the sheet is shared with the service account.
      - name: Finance sheet
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/sync_finance.py ${{ steps.mode.outputs.dry }}
