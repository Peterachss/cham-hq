name: Morning task email

# 00:00 UTC is 07:00 in Vietnam. GitHub's scheduler can run a few minutes
# late when it is busy; that is normal and nothing to fix.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:        # lets you send one by hand from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet google-cloud-firestore

      - name: Send the emails
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/send_reminders.py
